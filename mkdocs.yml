site_name: Моя База Знаний                # Название сайта в шапке и во вкладке браузера
site_description: База знаний MkDocs      # Описание сайта для поисковых систем

theme:                                    # Блок настройки внешнего вида сайта
  name: material                          # Использовать тему оформления Material
  language: ru                            # Включить русский язык для поиска и интерфейса
  palette:                                # Блок настройки цветовой палитры и тем
    # Настройка светлой (дневной) темы
    - media: "(prefers-color-scheme: light)" # Автовыбор, если в системе включен светлый режим
      scheme: default                     # Стандартная светлая схема оформления
      primary: indigo                     # Цвет шапки для светлой темы
      accent: indigo                      # Цвет ссылок для светлой темы
      toggle:
        icon: material/weather-night      # Иконка луны (клик по ней включит темную тему)
        name: Включить темную тему        # Всплывающая подсказка при наведении на иконку

    # Настройка темной (ночной) темы
    - media: "(prefers-color-scheme: dark)"  # Автовыбор, если в системе включен темный режим
      scheme: slate                       # Специальная темная схема оформления Slate
      primary: black                      # Цвет шапки для темной темы (стильный черный)
      accent: indigo                      # Цвет ссылок для темной темы
      toggle:
        icon: material/weather-sunny      # Иконка солнца (клик по ней включит светлую тему)
        name: Включить светлую тему       # Всплывающая подсказка при наведении на иконку
        
  features:                               # Блок активации встроенных функций темы
    - navigation.tabs                     # Добавить вкладки навигации вверху страницы
    - toc.follow                          # Правое меню статьи крутится при скролле
    - search.suggest                      # Включить подсказки при вводе в поиске
    - navigation.top                      # Активировать кнопку возврата наверх

plugins:                                  # Блок подключения плагинов
  - search                                # Включить встроенный поиск по статьям

extra_css:                                # Блок подключения личных стилей оформления
  - stylesheets/extra.css                 # Путь к файлу стилей для фиксации кнопки
