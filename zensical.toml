[project]
site_name = "Моя База Знаний"
site_description = "База знаний MkDocs"
# Крайне рекомендуется указать site_url, так как от него зависят некоторые функции навигации
site_url = "https://your-domain.com" 

[project.theme]
name = "material"
language = "ru"

[project.theme.font]
text = "Nunito"
code = "Fira Code"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
[project.theme.palette.toggle]
icon = "material/weather-night"
name = "Включить темную тему"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
[project.theme.palette.toggle]
icon = "material/weather-sunny"
name = "Включить светлую тему"

# Настройки возможностей темы (features) разделяются через структуру таблиц:
[project.theme.features.navigation]
tabs = true
top = true          # Та самая кнопка перемещения наверх
instant = true
sticky = true
breadcrumbs = true
sections = true

[project.theme.features.toc]
follow = true

[project.theme.features.search]
suggest = true
highlight = true
search_share = true

[project.theme.features.content]
code_copy = true
tooltips = true

# Структура навигации в Zensical пишется внутри секции [project.nav]
[project.nav]
"О базе знаний" = "index.md"
"Глоссарий" = "glossary.md"

[project.nav."Архитектура базы знаний"]
"Концепция системы управления базу знаний" = "kb-architecture/kb-concept.md"
"Порядок действий по созданию статьи базы знаний" = "kb-architecture/kb-create-article.md"
"Правила создания метаданных" = "kb-architecture/kb-article-metadata/kb-article-metadata.md"
"Правила оформления статей базы знаний" = "kb-architecture/kb-markdown-rules.md"
