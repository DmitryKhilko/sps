[project]
site_name = "Моя База Знаний"
site_description = "База знаний MkDocs"
site_url = "https://your-domain.com" 

# --- НАВИГАЦИЯ (Перенесена наверх, строго в секцию [project]) ---
nav = [
    { "О базе знаний" = "index.md" },
    { "Глоссарий" = "glossary.md" },
    { "Архитектура базы знаний" = [
        { "Концепция системы управления базой знаний" = "kb-architecture/kb-concept.md" },
        { "Порядок действий по созданию статьи базы знаний" = "kb-architecture/kb-create-article.md" },
        { "Правила оформления статей базы знаний" = "kb-architecture/kb-markdown-rules.md" },
        { "Правила создания метаданных" = [
            { "Инструкция по метаданным" = "kb-architecture/kb-article-metadata/kb-article-metadata.md" }
        ]}
    ]}
]

# --- НАСТРОЙКИ ТЕМЫ ---
[project.theme]
name = "material"
language = "ru"

[project.theme.font]
text = "Nunito"
code = "Fira Code"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
[project.theme.palette.toggle]
icon = "material/weather-night"
name = "Включить темную тему"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "indigo"
[project.theme.palette.toggle]
icon = "material/weather-sunny"
name = "Включить светлую тему"

# --- ВОЗМОЖНОСТИ ТЕМЫ (FEATURES) ---
[project.theme.features.navigation]
tabs = true
top = true          # Кнопка перемещения наверх (появится при скролле вверх)
instant = true
sticky = true
breadcrumbs = true
sections = true

[project.theme.features.toc]
follow = true

[project.theme.features.search]
suggest = true
highlight = true
share = true

[project.theme.features.content]
"code.copy" = true
tooltips = true
